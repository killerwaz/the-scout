<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330" role="img" aria-label="How a question becomes an answer: ask, plan, search, fetch, score, answer. Scoring loops back to search until there are enough good sources. Hard limits apply at every step.">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#13213f"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5eead4"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="1280" height="330" rx="24" fill="url(#bg2)"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- loop: score back to search -->
    <path d="M900 88 V52 H492 V84" fill="none" stroke="#fbbf24" stroke-opacity="0.8" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrowAmber)"/>
    <text x="696" y="40" fill="#fde68a" font-size="14" font-weight="600">not enough good sources yet</text>

    <!-- six steps: boxes 170 wide, 34 apart, starting at x=45 -->
    <g fill="#ffffff" fill-opacity="0.05" stroke="#2dd4bf" stroke-opacity="0.45" stroke-width="1.5">
      <rect x="45" y="92" width="170" height="124" rx="16"/>
      <rect x="249" y="92" width="170" height="124" rx="16"/>
      <rect x="453" y="92" width="170" height="124" rx="16"/>
      <rect x="657" y="92" width="170" height="124" rx="16"/>
      <rect x="861" y="92" width="170" height="124" rx="16"/>
      <rect x="1065" y="92" width="170" height="124" rx="16" stroke="#fbbf24" stroke-opacity="0.7"/>
    </g>

    <g stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)">
      <line x1="219" y1="154" x2="244" y2="154"/>
      <line x1="423" y1="154" x2="448" y2="154"/>
      <line x1="627" y1="154" x2="652" y2="154"/>
      <line x1="831" y1="154" x2="856" y2="154"/>
      <line x1="1035" y1="154" x2="1060" y2="154"/>
    </g>

    <g fill="#5eead4" font-size="13" font-weight="700" letter-spacing="2">
      <text x="130" y="120">1</text>
      <text x="334" y="120">2</text>
      <text x="538" y="120">3</text>
      <text x="742" y="120">4</text>
      <text x="946" y="120">5</text>
      <text x="1150" y="120" fill="#fbbf24">6</text>
    </g>

    <g fill="#ffffff" font-size="24" font-weight="700">
      <text x="130" y="152">Ask</text>
      <text x="334" y="152">Plan</text>
      <text x="538" y="152">Search</text>
      <text x="742" y="152">Fetch</text>
      <text x="946" y="152">Score</text>
      <text x="1150" y="152">Answer</text>
    </g>

    <g fill="#aab8d2" font-size="13.5">
      <text x="130" y="178">Claude chat, Telegram</text>
      <text x="130" y="196">or an n8n workflow</text>
      <text x="334" y="178">sub-questions</text>
      <text x="334" y="196">and searches</text>
      <text x="538" y="178">free engines, open</text>
      <text x="538" y="196">APIs and feeds</text>
      <text x="742" y="178">plain HTTP first,</text>
      <text x="742" y="196">then a real Chrome</text>
      <text x="946" y="178">each page 0 to 3,</text>
      <text x="946" y="196">injections dropped</text>
      <text x="1150" y="178">short, with</text>
      <text x="1150" y="196">numbered sources</text>
    </g>

    <!-- the limits under everything -->
    <rect x="45" y="250" width="1190" height="48" rx="14" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.4"/>
    <text x="640" y="280" fill="#fde68a" font-size="15.5" font-weight="600">Hard limits at every step:  no payments  ·  no passwords  ·  no deletes  ·  no CAPTCHAs  ·  no local network</text>
  </g>
</svg>
